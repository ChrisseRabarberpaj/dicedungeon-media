name: Queue approved posts in Buffer

# Manual runs default to dry-run. The daily schedule only moves posts that are
# already approved: true into free Buffer slots (free plan: 10 per channel).
on:
  schedule:
    - cron: "15 5 * * *"   # 08:15 Helsinki summer time, 07:15 winter time
  workflow_dispatch:
    inputs:
      post:
        description: "Post id to send (blank = every approved post)"
        required: false
        default: ""
      action:
        description: "dry-run = print only, draft = Buffer drafts to preview (nothing publishes), send = queue approved posts, update = push file edits to posts already in Buffer, inspect = list channels (read-only)"
        type: choice
        options: [dry-run, draft, send, update, inspect]
        default: dry-run

permissions:
  contents: write

concurrency: buffer-queue

jobs:
  queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Queue
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          POST_ID: ${{ inputs.post }}
          ACTION: ${{ inputs.action }}
        run: |
          if [ "$ACTION" = "inspect" ]; then
            python scripts/queue_posts.py --channels
            python scripts/queue_posts.py --introspect
            exit 0
          fi
          args=()
          if [ -n "$POST_ID" ]; then args+=(--post "$POST_ID"); fi
          if [ "$ACTION" = "dry-run" ]; then args+=(--dry-run); fi
          if [ "$ACTION" = "draft" ]; then args+=(--draft); fi
          if [ "$ACTION" = "update" ]; then args+=(--update); fi
          python scripts/queue_posts.py "${args[@]}"
      - name: Record queued ids
        if: ${{ github.event_name == 'schedule' || inputs.action == 'send' || inputs.action == 'draft' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898273+github-actions[bot]@users.noreply.github.com"
          git add posts
          git diff --cached --quiet || git commit -m "Record Buffer post ids"
          git push
