name: Queue approved posts in Buffer

# Manual only: nothing reaches Buffer until someone presses "Run workflow"
# (or runs `gh workflow run queue-posts.yml`). Dry run is the default.
on:
  workflow_dispatch:
    inputs:
      post:
        description: "Post id to send (blank = every approved post)"
        required: false
        default: ""
      dry_run:
        description: "Dry run (print, send nothing)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency: buffer-queue

jobs:
  queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Queue
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          POST_ID: ${{ inputs.post }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=()
          if [ -n "$POST_ID" ]; then args+=(--post "$POST_ID"); fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          python scripts/queue_posts.py "${args[@]}"
      - name: Record queued ids
        if: ${{ inputs.dry_run == false }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898273+github-actions[bot]@users.noreply.github.com"
          git add posts
          git diff --cached --quiet || git commit -m "Record Buffer post ids"
          git push
