text: |
  Miltä pelinjohtajan vetämä tiimi-ilta Dice Dungeonissa oikeasti näyttää?

  Ennen iltaa pelinjohtaja on teihin yhteydessä: fantasiaa vai kauhua, kuinka moni on pelannut ennen, kielitoiveet. Sen pohjalta seikkailu valmistellaan teille.

  Illalla jokainen saa valmiin hahmon, eikä kenenkään tarvitse osata sääntöjä. Pelinjohtaja vetää kolme tai viisi tuntia, valot ja äänet vaihtuvat tarinan mukana, ja jossain vaiheessa talouspäällikkö neuvottelee lohikäärmeen kanssa.

  Jälkeenpäin teillä on tarina, josta puhutaan vielä ensi vuoden pikkujouluissa.

  Enintään 7 pelaajaa, Töölössä, suomeksi, ruotsiksi tai englanniksi. Tiimi-ilta 3 h 500 € + alv, tiimipäivä 5 h 750 € + alv. booking@talecraftgames.com
